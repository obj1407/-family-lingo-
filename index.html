<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리집 듀오링고 🦉 | 300일 영어 챌린지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background-color: #ffffff; }
        .duo-green { background-color: #58CC02; color: white; }
        .duo-green:hover { background-color: #4dae02; }
        .duo-blue { background-color: #1CB0F6; color: white; }
        .duo-blue:hover { background-color: #1899d6; }
        .duo-purple { background-color: #CE82FF; color: white; }
        .duo-purple:hover { background-color: #b56ce6; }
        .option-btn { transition: all 0.1s; border-bottom: 4px solid #e5e7eb; }
        .option-btn:active { border-bottom-width: 0px; transform: translateY(4px); }
        .option-btn.selected { border-color: #1CB0F6; background-color: #DDF4FF; color: #1CB0F6; }
        .option-btn.correct { border-color: #58CC02; background-color: #d7ffb8; color: #58CC02; }
        .option-btn.wrong { border-color: #FF4B4B; background-color: #ffdfe0; color: #FF4B4B; }
        .level-btn { transition: all 0.15s; border-bottom: 6px solid; }
        .level-btn:active { border-bottom-width: 2px; transform: translateY(4px); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen bg-gray-50">

    <!-- ========== 화면 1: 시작 화면 ========== -->
    <div id="home-screen" class="w-full max-w-md p-6 fade-in">
        <div class="text-center mb-8 mt-8">
            <div class="text-7xl mb-4">🦉</div>
            <h1 class="text-3xl font-black text-gray-800 mb-2">우리집 듀오링고</h1>
            <p class="text-gray-500">300일 영어 챌린지</p>
        </div>

        <!-- 통계 카드 -->
        <div class="grid grid-cols-3 gap-3 mb-8">
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <div class="text-2xl">🔥</div>
                <div id="streak-count" class="text-xl font-black text-orange-500">0</div>
                <div class="text-xs text-gray-500">연속일</div>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <div class="text-2xl">⭐</div>
                <div id="total-xp" class="text-xl font-black text-yellow-500">0</div>
                <div class="text-xs text-gray-500">총 XP</div>
            </div>
            <div class="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <div class="text-2xl">📅</div>
                <div id="day-count" class="text-xl font-black text-blue-500">1</div>
                <div class="text-xs text-gray-500">Day</div>
            </div>
        </div>

        <!-- 난이도 선택 -->
        <h2 class="text-lg font-bold text-gray-700 mb-4">오늘의 난이도를 선택하세요</h2>
        <div class="space-y-3">
            <button onclick="startLevel('beginner')" 
                class="level-btn w-full p-5 rounded-xl bg-green-50 border-green-500 text-left flex items-center gap-4">
                <div class="text-4xl">🌱</div>
                <div class="flex-1">
                    <div class="font-black text-green-700 text-lg">초급 (Beginner)</div>
                    <div class="text-sm text-gray-600">기초 회화, 일상 표현</div>
                </div>
                <div class="text-green-600 font-bold">→</div>
            </button>
            <button onclick="startLevel('intermediate')" 
                class="level-btn w-full p-5 rounded-xl bg-blue-50 border-blue-500 text-left flex items-center gap-4">
                <div class="text-4xl">🌿</div>
                <div class="flex-1">
                    <div class="font-black text-blue-700 text-lg">중급 (Intermediate)</div>
                    <div class="text-sm text-gray-600">여행, 비즈니스, 토론</div>
                </div>
                <div class="text-blue-600 font-bold">→</div>
            </button>
            <button onclick="startLevel('advanced')" 
                class="level-btn w-full p-5 rounded-xl bg-purple-50 border-purple-500 text-left flex items-center gap-4">
                <div class="text-4xl">🌳</div>
                <div class="flex-1">
                    <div class="font-black text-purple-700 text-lg">고급 (Advanced)</div>
                    <div class="text-sm text-gray-600">뉴스, 관용구, 심화 표현</div>
                </div>
                <div class="text-purple-600 font-bold">→</div>
            </button>
        </div>

        <button onclick="resetProgress()" class="mt-8 w-full text-sm text-gray-400 hover:text-gray-600">
            🔄 진행 상황 초기화
        </button</button>
    </div>

    <!-- ========== 화면 2: 학습 화면 ========== -->
    <div id="quiz-screen" class="hidden w-full max-w-md p-4 fade-in">
        <div class="flex items-center gap-3 mb-6 mt-2">
            <button onclick="exitQuiz()" class="text-gray-400 text-2xl">✕</button>
            <div class="flex-1 bg-gray-200 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="duo-green h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex items-center gap-1 text-red-500 font-bold">
                <span>❤️</span> <span id="hearts">5</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm mb-24 min-h-[300px]">
            <div id="category-tag" class="inline-block px-3 py-1 bg-gray-100 rounded-full text-xs font-bold text-gray-600 mb-4"></div>
            <h2 id="question-prompt" class="text-xl font-bold text-gray-800 mb-6"></h2>
            <div id="options-container" class="grid grid-cols-1 gap-3"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 max-w-md mx-auto">
            <button id="check-btn" onclick="checkAnswer()" disabled
                class="w-full py-4 rounded-xl font-bold text-lg text-white bg-gray-300 cursor-not-allowed">
                확인
            </button>
        </div>
    </div>

    <!-- ========== 화면 3: 결과 화면 ========== -->
    <div id="result-screen" class="hidden w-full max-w-md p-6 text-center fade-in">
        <div class="mt-12">
            <div id="result-emoji" class="text-8xl mb-4">🎉</div>
            <h1 id="result-title" class="text-3xl font-black text-gray-800 mb-2">레슨 완료!</h1>
            <p id="result-subtitle" class="text-gray-500 mb-8">오늘도 열심히 했어요!</p>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-6">
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <div class="text-3xl font-black text-yellow-500" id="result-xp">0</div>
                        <div class="text-xs text-gray-500">획득 XP</div>
                    </div>
                    <div>
                        <div class="text-3xl font-black text-green-500" id="result-correct">0</div>
                        <div class="text-xs text-gray-500">정답</div>
                    </div>
                    <div>
                        <div class="text-3xl font-black text-orange-500" id="result-streak">0</div>
                        <div class="text-xs text-gray-500">연속일</div>
                    </div>
                </div>
            </div>

            <button onclick="goHome()" class="w-full py-4 rounded-xl font-bold text-lg duo-green shadow-[0_4px_0_0_#46a302] active:shadow-none active:translate-y-1">
                계속하기
            </button>
        </div>
    </div>

    <!-- 피드백 바 -->
    <div id="feedback-bar" class="hidden fixed bottom-0 left-0 right-0 p-6 text-white font-bold text-center max-w-md mx-auto">
        <p id="feedback-text"></p>
        <button id="continue-btn" onclick="nextQuestion()" class="mt-4 px-8 py-2 rounded-xl bg-white text-gray-800 font-bold">
            계속
        </button>
    </div>

let currentLevel = null;
let currentIndex = 0;
let sessionQuestions = [];
let selectedOption = null;
let hearts = 5;
let xp = 0;
let correctCount = 0;

function getStats() {
    const stats = localStorage.getItem('familyLingoStats');
    if (stats) return JSON.parse(stats);
    return { totalXp: 0, streak: 0, lastDate: null, completedDays: [] };
}

function saveStats(stats) {
    localStorage.setItem('familyLingoStats', JSON.stringify(stats));
}

function updateStreak() {
    const stats = getStats();
    const today = new Date().toDateString();
    if (stats.lastDate === today) return;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (stats.lastDate === yesterday.toDateString()) {
        stats.streak += 1;
    } else if (stats.lastDate !== today) {
        stats.streak = 1;
    }
    if (!stats.completedDays.includes(today)) {
        stats.completedDays.push(today);
    }
    stats.lastDate = today;
    saveStats(stats);
}

function getDayNumber() {
    const stats = getStats();
    const firstDate = stats.completedDays.length > 0 ? new Date(stats.completedDays[0]) : new Date();
    const today = new Date();
    const diff = Math.floor((today - firstDate) / (1000 * 60 * 60 * 24)) + 1;
    return Math.min(diff, 300);
}

function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0;
    }
    return Math.abs(hash);
}

function getDailyQuestions(level) {
    const allQuestions = questionsDB[level];
    const today = new Date().toDateString();
    const seed = hashString(today + level);
    const shuffled = [...allQuestions].sort((a, b) => {
        const hashA = hashString(a.prompt + seed);
        const hashB = hashString(b.prompt + seed);
        return hashA - hashB;
    });
    return shuffled.slice(0, 20);
}

function showScreen(screenId) {
    ['home-screen', 'quiz-screen', 'result-screen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(screenId).classList.remove('hidden');
    document.getElementById(screenId).classList.add('fade-in');
}

function goHome() {
    showScreen('home-screen');
    updateHomeStats();
}

function updateHomeStats() {
    const stats = getStats();
    document.getElementById('streak-count').innerText = stats.streak;
    document.getElementById('total-xp').innerText = stats.totalXp;
    document.getElementById('day-count').innerText = getDayNumber();
}

function exitQuiz() {
    if (confirm('정말 나가시겠어요? 진행 상황은 저장되지 않습니다.')) {
        goHome();
    }
}

function resetProgress() {
    if (confirm('정말 모든 진행 상황을 초기화하시겠어요?')) {
        localStorage.removeItem('familyLingoStats');
        updateHomeStats();
        alert('초기화되었습니다!');
    }
}

function startLevel(level) {
    currentLevel = level;
    sessionQuestions = getDailyQuestions(level);
    currentIndex = 0;
    hearts = 5;
    xp = 0;
    correctCount = 0;
    showScreen('quiz-screen');
    loadQuestion();
}

function loadQuestion() {
    if (currentIndex >= sessionQuestions.length) {
        finishSession();
        return;
    }
    const q = sessionQuestions[currentIndex];
    document.getElementById('category-tag').innerText = q.cat;
    document.getElementById('question-prompt').innerText = q.prompt;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    selectedOption = null;
    updateCheckButton();
    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.className = 'option-btn w-full p-4 rounded-xl border-2 border-gray-200 bg-white text-gray-700 font-semibold text-left';
        btn.onclick = () => selectOption(btn, opt);
        container.appendChild(btn);
    });
    const progress = (currentIndex / sessionQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;
    document.getElementById('hearts').innerText = hearts;
}

function selectOption(btn, value) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = value;
    updateCheckButton();
}

function updateCheckButton() {
    const btn = document.getElementById('check-btn');
    if (selectedOption) {
        btn.disabled = false;
        btn.className = 'w-full py-4 rounded-xl font-bold text-lg text-white duo-green cursor-pointer shadow-[0_4px_0_0_#46a302] active:shadow-none active:translate-y-1 transition-all';
    } else {
        btn.disabled = true;
        btn.className = 'w-full py-4 rounded-xl font-bold text-lg text-white bg-gray-300 cursor-not-allowed';
    }
}

function checkAnswer() {
    const q = sessionQuestions[currentIndex];
    const isCorrect = selectedOption === q.answer;
    const feedbackBar = document.getElementById('feedback-bar');
    const feedbackText = document.getElementById('feedback-text');
    const continueBtn = document.getElementById('continue-btn');
    document.getElementById('check-btn').classList.add('hidden');
    document.querySelectorAll('.option-btn').forEach(btn => {
        if (btn.innerText === q.answer) btn.classList.add('correct');
        else if (btn.classList.contains('selected') && !isCorrect) btn.classList.add('wrong');
        btn.onclick = null;
    });
    feedbackBar.classList.remove('hidden');
    if (isCorrect) {
        feedbackBar.className = 'fixed bottom-0 left-0 right-0 p-6 bg-green-100 border-t-2 border-green-500 text-green-700 font-bold text-center max-w-md mx-auto';
        feedbackText.innerText = '🎉 정답입니다! +10 XP';
        xp += 10;
        correctCount++;
    } else {
        feedbackBar.className = 'fixed bottom-0 left-0 right-0 p-6 bg-red-100 border-t-2 border-red-500 text-red-700 font-bold text-center max-w-md mx-auto';
        feedbackText.innerText = `😢 틀렸습니다. 정답: ${q.answer}`;
        hearts--;
        document.getElementById('hearts').innerText = hearts;
        if (hearts <= 0) {
            continueBtn.innerText = '결과 보기';
            continueBtn.onclick = () => {
                feedbackBar.classList.add('hidden');
                finishSession();
            };
            return;
        }
    }
    continueBtn.innerText = '계속';
    continueBtn.onclick = nextQuestion;
}

function nextQuestion() {
    currentIndex++;
    document.getElementById('feedback-bar').classList.add('hidden');
    document.getElementById('check-btn').classList.remove('hidden');
    loadQuestion();
}

function finishSession() {
    const stats = getStats();
    stats.totalXp += xp;
    saveStats(stats);
    updateStreak();
    const updatedStats = getStats();
    document.getElementById('result-xp').innerText = xp;
    document.getElementById('result-correct').innerText = `${correctCount}/20`;
    document.getElementById('result-streak').innerText = updatedStats.streak;
    if (correctCount >= 18) {
        document.getElementById('result-emoji').innerText = '🏆';
        document.getElementById('result-title').innerText = '완벽해요!';
        document.getElementById('result-subtitle').innerText = '정말 대단합니다!';
    } else if (correctCount >= 14) {
        document.getElementById('result-emoji').innerText = '🎉';
        document.getElementById('result-title').innerText = '잘 했어요!';
        document.getElementById('result-subtitle').innerText = '꾸준히 하면 실력 느는 거 알죠?';
    } else if (correctCount >= 10) {
        document.getElementById('result-emoji').innerText = '💪';
        document.getElementById('result-title').innerText = '좋은 시작이에요!';
        document.getElementById('result-subtitle').innerText = '내일은 더 잘할 수 있어요!';
    } else {
        document.getElementById('result-emoji').innerText = '🔥';
        document.getElementById('result-title').innerText = '포기하지 마세요!';
        document.getElementById('result-subtitle').innerText = '꾸준함이 실력을 만들어요!';
    }
    showScreen('result-screen');
}

updateHomeStats();
</script>
</body>
</html>
